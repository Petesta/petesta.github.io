<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Dark by default, light when the system asks for it (style.css) -->
  <meta name="color-scheme" content="dark light">
  <!-- The browser's toolbar on some phones and browsers, and the edge of Discord's link cards -->
  <meta name="theme-color" content="#FEBC11">
  <!-- The M1F3 mug (site-icons-variants-24.html), outlined so one file works on light and dark tabs; favicon.ico is for browsers without SVG icons -->
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <title>Pete Cruz · Software Engineer</title>
  <meta name="description" content="Pete Cruz | Vim inspired blog site.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- Lets style.css hide the build's no-JavaScript copy of the home page until main.js draws it -->
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <main id="vim-container" aria-label="Pete Cruz — personal site">

    <nav id="tabline" data-mode="normal" aria-label="Buffers"></nav>

    <div id="editor-area">
      <!-- Search bar (design blog-search-variants-6.html, A), across the top of the buffer
           like Neovim's winbar. main.js lists the matching posts under it. The magnifier is
           Font Awesome Free's magnifying-glass (CC BY 4.0, https://fontawesome.com/license/free). -->
      <div id="winbar" data-state="idle">
        <span class="wb-ic" aria-hidden="true"><svg viewBox="0 0 512 512" fill="currentColor"><path d="M416 208c0 45.9-14.9 88.3-40 122.7L502.6 457.4c12.5 12.5 12.5 32.8 0 45.3s-32.8 12.5-45.3 0L330.7 376c-34.4 25.2-76.8 40-122.7 40C93.1 416 0 322.9 0 208S93.1 0 208 0S416 93.1 416 208zM208 352a144 144 0 1 0 0-288 144 144 0 1 0 0 288z"/></svg></span>
        <input id="search" type="text" placeholder="Search posts" aria-label="Search posts" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-list" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search">
        <span id="search-count" class="wb-n" aria-live="polite"></span>
      </div>
      <div id="search-list" role="listbox" aria-label="Posts" hidden></div>
      <article id="content" tabindex="-1" aria-live="polite" aria-label="Buffer content"></article>
    </div>

    <footer id="statusline" data-mode="normal" aria-label="Status line">
      <span id="sl-mode" class="sl-seg">
        <span id="sl-browser" class="sl-icon" role="img"></span>
        <span id="mode-indicator" aria-label="Vim mode">NORMAL</span>
      </span>
      <span class="sl-sep sl-sep-mode" aria-hidden="true"></span>
      <output id="sl-filename" aria-label="Current file">index.html</output>
      <span class="sl-fill" aria-hidden="true"></span>
      <span class="sl-sep sl-sep-ft" aria-hidden="true"></span>
      <span id="sl-filetype" class="sl-seg" aria-label="File type">
        <span id="sl-ft-icon" class="sl-icon"></span>
        <span id="sl-ft-label">html</span>
      </span>
      <span class="sl-sep sl-sep-pos" aria-hidden="true"></span>
      <output id="sl-pos" class="sl-seg" aria-label="Cursor position">1,1</output>
      <span class="sl-sep sl-sep-pct" aria-hidden="true"></span>
      <output id="sl-pct" class="sl-seg" aria-label="Scroll position">Top</output>
    </footer>


  </main>
  <!-- posts.js is generated by the build (npm run build) from posts/*.md -->
  <script src="/posts.js"></script>
  <script src="/render.js"></script>
  <script src="/main.js"></script>
</body>
</html>
